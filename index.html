<script>
// ========== Article Data ==========
const articles = [
  {
    id: 4,
    title: "血稚",
    date: "2026-05-26",
    tags: ["文学", "思考"],
    panel: "jiuba",
    summary: "一篇关于蜻蜓稚虫实验的文学短篇。编号A-73-05的实验体在封闭的生态缸中完成了从卵到成虫的羽化，却在第一次振翅时撞上了透明的玻璃屏障。它用生命叩问着一个冰冷的问题：在绝对的理性与规则之下，那些无法被量化的渴望与本能，是否注定只能成为实验报告里一句轻描淡写的「异常行为」。",
    content: `
## 一

换好衣服的教授，急忙推开实验室的门。今天的他，无论如何都要获得一个结果，一个完整的实验结果，那是他为了保住自己的位子，向学生分享成果，必须要完成的课题。

两位学生离开生态缸前，让教授独自观察。样本A-73-05即将迎来它最后的时刻。

**【日志条目：第402天 - 09:00】**

**观察记录：个体A-73-05于09:00被观测到静止于缸底基质上，对机械刺激无反应。生命体征消失。终止确认。**

**尸检显示：飞行肌能量储备完全枯竭，多处翅脉断裂，头部有微观出血点——均与频繁撞击隔离屏障的物理性损伤模式吻合。其死亡主因为能量耗尽，直接诱因为持续性异常行为。该样本数据极具价值，证明了在封闭环境下，某些非适应性本能行为可被强化至导致自我毁灭的程度。尸体归档，编号【A-73-05-TER】。**

A-73-05最终耗尽力气，跌落在水缸底部，翅膀微微颤动，复眼依然倒映着它永远无法触及的窗外天空。

"整理所有日志和研究数据，准备明天课上的汇报。"教授如释重负，随即打算离开实验室。

"教授。"团队里的一位学生叫住了他："A-73-05是目前最成功的实验体，它为什么会在实验的最后做出近乎疯狂一般，想要毁掉自己的行为呢？"

教授没有回答，离开了实验室，或许他的沉默便是最好的回应——在这个生态系统当中，作为造物主，你所要具备的，只有绝对的理性与客观的记录。

教授走后，这个学生向另一位学生问道："样本间观察到「物质」的转移行为。这是血吗？"

"并非哦，在实验室里，它只被称作「种内竞争导致的营养再分配」。但对于A-73-05来说，那就是它生存下去所需要的、温热的一切。"

至于A-73-05实验体，在自然界中，有个更加为人们所熟知的称呼——蜻蜓。

## 二

- 项目编号：ODONATA-73【个体样本A-73-05全生命周期观察日志】

- 【日志条目：第1天】

- 观察记录：样本组A-73（卵簇）已置入生态缸A7。环境参数设定：水温25°C，pH 7.2，光照周期12L:12D。一切稳定，等待孵化。

**【日志条目：第7天】**

**观察记录：孵化完成。初步观测稚虫存活率98.3%。个体表现出负趋光性，聚集于缸底沉积物中。投入定量水蚤作为初始食物源。所有个体均表现出摄食反应。**

命运在诞生前便已被书写。基因——这些与生俱来、无法选择的东西，决定了哪些"卵"将被放置在哪个培养皿中。

水族箱的顶部有一盏模拟日照的灯。一些敏感的稚虫会本能地被光线吸引，向上游动，但很快会碰到冰冷的玻璃盖，被撞回水底。它们人生第一次触碰边界，感到困惑，但久而久之便习惯了。这个"灯"就是它们对"天空"的全部理解——一个无法触及的、温暖的光源。

恒温恒湿的水族箱，经过消毒的纯净水，一切变量都被精确控制，排除了所有"意外"和"不洁"。一种令人窒息的"安全"。

**【日志条目：第37天】**

**观察记录：个体间开始出现资源竞争行为。个体A-73-05展现出高度攻击性，其捕食器官"面具"的弹射速度与精度优于同批样本。观察到其从其它个体处成功夺食。记录：A-73-05初期发育优势确立。**

> "在这种状态下，久而久之，会出现'物质转移'的现象，即是种内捕食与互相残杀的行为，它们栖息在池塘、湖泊等水域中。这些环境中的食物资源是有限的，且分布并不均匀，当一个水域中稚虫的密度过高时，对食物的竞争会变得异常激烈。在食物匮乏时，身边其他弱小的、正在蜕皮的或刚孵化的同类，就成为了最易得、营养最丰富的'移动蛋白质'，吃掉同类不仅能消除一个竞争对手，还能直接为自己提供能量，增加自身的生存几率。"

这就是水底的童年。在永恒的昏暗之中，生存的法则简单而血腥：成长，就是吞噬他人或被他人吞噬。A-73-05是这条法则最优秀的践行者，它用无数同类的"物质"滋养了自己，变得强壮而狰狞。它在这个体制内如鱼得水，并将体制内的规则内化为唯一真理。从未见过天空的人，会认为世界就是淤泥和水草。此时的"恶"是一种天真的、基于生存本能的残酷，它们不知道所谓"不残酷"的活法。

**【日志条目：第155天】**

**观察记录：随着样本密度压力提升，"物质转移"事件频率上升至日均1.3起。个体A-73-05已成为缸内顶级捕食者，体型为同期样本的127%。新现象：A-73-05周期性脱离底栖区域，垂直上浮至水体表面的人工光照平台下方，进行长时间探查。此行为不伴随捕食意图，且消耗额外能量。记录：定义此无效探索行为为异常行为K7。需关注其能量消耗。**

**【日志条目：第288天】**

**观察记录：异常行为K7在个体A-73-05身上固化且强化，频率升至每小时2-3次。行为模式升级为以头部撞击光照平台的透明基底。高速摄影显示撞击力度轻微但持续。分析：此行为可能关联其即将到来的羽化期预备行为，但在封闭环境中属严重适应不良。其头壳已出现因撞击导致的微观磨损。记录：将A-73-05标记为"高关注样本"，其羽化过程将成为关键观察节点。**

一种莫名的冲动在它体内苏醒，驱使它一次次离开安全的淤泥，逆着重力，向上浮升。它撞向那片它无法理解的光明屏障，一次……又一次。那光是它的神，也是它的狱。它用身体叩问着一个它无法提出的问题，进行着一场无人理解、孤独的朝圣。

科学日志冷静地记录着这一切，将它的渴望定义为"行为失序"，将它的执着定义为"有害变量"。

const validRoutes = ['home', 'about', 'zatan', 'panel2', 'jiuba'];

  const params = data ? `/${data.id}` : '';
  const { route: currentRoute } = getRoute();
  if (route === 'post') previousRoute = currentRoute === 'home' ? 'jiuba' : currentRoute;
  window.location.hash = `#/${route}${params}`;
  updateNav(route);
  render();
}

function getRoute() {
  const hash = window.location.hash.slice(2) || 'home';
  const [route, queryStr] = hash.split('?');

  if (/^\d+$/.test(route)) return { route: 'post', postId: parseInt(route) };
